name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up micromamba
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          cache-environment: true
          cache-downloads: true

      - name: Register ipykernel
        shell: micromamba-shell {0}
        run: python -m ipykernel install --user --name python3

      - name: Check canonical blocks
        shell: micromamba-shell {0}
        run: python tools/check_canonical.py

      - name: Check badge URLs
        shell: micromamba-shell {0}
        run: python tools/check_badges.py

      - name: Verify notebooks have no outputs committed
        shell: micromamba-shell {0}
        run: |
          for nb in *.ipynb; do
            nbstripout --verify "$nb" || {
              echo "FAIL: $nb contains committed outputs. Run nbstripout before committing."
              exit 1
            }
          done

      - name: Run notebooks
        shell: micromamba-shell {0}
        env:
          MPLBACKEND: Agg
          OMP_NUM_THREADS: "1"
          DD2365_FAST: "1"
        run: python tools/run_notebooks.py

      - name: Snapshot — run
        shell: micromamba-shell {0}
        env:
          MPLBACKEND: Agg
          OMP_NUM_THREADS: "1"
        run: python tools/snapshot_qoi.py run --fast --out /tmp/snapshot_ci.json

      - name: Snapshot — regression guard
        if: github.event_name != 'workflow_dispatch'
        shell: micromamba-shell {0}
        run: >
          python tools/snapshot_qoi.py compare
          tools/baseline_fast_ci.json /tmp/snapshot_ci.json --rtol 1e-6

      - name: Upload snapshot artifact (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: baseline-fast-ci
          path: /tmp/snapshot_ci.json
          retention-days: 30
